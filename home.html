<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Title and link -->
        <title>Github-Issue-Tracker</title>
        <link
            rel="shortcut icon"
            href="./assets/github-logo.png"
            type="image/x-icon"
        />

        <!-- Font Awesome -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
            integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <!-- font integration -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
        <!-- tailwind + daisy ui -->
        <link
            href="https://cdn.jsdelivr.net/npm/daisyui@5"
            rel="stylesheet"
            type="text/css"
        />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <!-- style -->
        <link rel="stylesheet" href="./styles/style.css" />
    </head>
    <body class="container mx-auto">
        <header>
            <div class="navbar bg-base-100 shadow-sm">
                <div class="flex-1">
                    <div class="flex items-center">
                        <img
                            class="w-8 md:w-[3%]"
                            src="./assets/github-logo.png"
                            alt=""
                        />
                        <a class="btn btn-ghost text-xl"
                            >GitHub Issues Tracker</a
                        >
                    </div>
                </div>
                <div class="flex gap-2">
                    <input
                        id="searchInput"
                        type="text"
                        placeholder="Search issues..."
                        class="input w-24 md:w-auto"
                    />
                </div>
            </div>
        </header>

        <section class="my-10">
            <div id="all-levels" class="bg-gray-100 rounded-lg py-6 pl-5">
                <button
                    id="all-button"
                    class="btn btn-outline btn-primary group-button"
                >
                    All
                </button>
                <button
                    id="open-button"
                    class="btn btn-outline btn-primary group-button"
                >
                    Open
                </button>
                <button
                    id="closed-button"
                    class="btn btn-outline btn-primary group-button"
                >
                    Closed
                </button>
            </div>
            <div class="mt-6 bg-gray-100 rounded-lg p-4">
                <div class="flex justify-between items-center pb-3 border-b">
                    <div class="flex items-center gap-3">
                        <img
                            class="bg-purple-200 p-2 rounded-full"
                            src="./assets/Aperture.png"
                            alt=""
                        />
                        <div>
                            <h1 class="font-bold">
                                <span id="total-issue">00</span> Issues
                            </h1>
                            <p class="">Track and manage your project issues</p>
                        </div>
                    </div>
                    <div class="flex gap-4">
                        <div class="flex items-center gap-2">
                            <div
                                class="bg-[#00A96E] rounded-full w-3 h-3"
                            ></div>
                            <p>Open</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <div
                                class="bg-[#A855F7] rounded-full w-3 h-3"
                            ></div>
                            <p>Closed</p>
                        </div>
                    </div>
                </div>
                <div
                    id="displayCard"
                    class="mt-5 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3"
                ></div>
            </div>
        </section>

        <section id="spinner" class="flex justify-center items-center">
            <span class="loading loading-bars loading-xl"></span>
        </section>

        <!-- Issue Details Modal -->
        <!-- Open the modal using ID.showModal() method -->
        <!-- <button class="btn" onclick="my_modal_5.showModal()">open modal</button> -->
        <dialog id="my_modal_5" class="modal modal-bottom sm:modal-middle">
            <div
                id="details-container"
                class="modal-box max-w-4xl w-11/12 sm:w-10/12 lg:w-full bg-white rounded-2xl border-2 border-blue-400 p-0 shadow-xl max-h-[90vh]"
            ></div>
        </dialog>

        <script src="./scripts/script.js"></script>
    </body>
</html>
