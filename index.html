<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Title and link -->
        <title>Github-Issue-Tracker</title>
        <link
            rel="shortcut icon"
            href="./assets/github-logo.png"
            type="image/x-icon"
        />
        <!-- Font Awesome -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
            integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <!-- font integration -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
        <!-- tailwind + daisy ui -->
        <link
            href="https://cdn.jsdelivr.net/npm/daisyui@5"
            rel="stylesheet"
            type="text/css"
        />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <!-- style -->
        <link rel="stylesheet" href="./styles/style.css" />
    </head>
    <body>
        <section
            class="container mx-auto w-full h-screen flex justify-center items-center"
        >
            <div
                class="w-full max-w-md p-8 space-y-3 rounded-xl dark:bg-gray-50 dark:text-gray-800 shadow-lg"
            >
                <div
                    class="flex flex-col justify-center items-center space-y-2"
                >
                    <img class="" src="./assets/github-logo.png" alt="" />
                    <h1 class="text-xl font-bold text-center">
                        GitHub Issues Tracker
                    </h1>
                    <p class="text-gray-600">Sign in to manage your issues</p>
                </div>
                <form novalidate="" action="" class="space-y-6">
                    <div class="space-y-1 text-sm">
                        <label for="username" class="block dark:text-gray-600"
                            >Username</label
                        >
                        <input
                            type="text"
                            name="username"
                            id="username"
                            placeholder="Username"
                            class="w-full px-4 py-3 rounded-md dark:border-gray-300 dark:bg-gray-50 dark:text-gray-800 focus:dark:border-violet-600"
                        />
                    </div>
                    <div class="space-y-1 text-sm">
                        <label for="password" class="block dark:text-gray-600"
                            >Password</label
                        >
                        <input
                            type="password"
                            name="password"
                            id="password"
                            placeholder="Password"
                            class="w-full px-4 py-3 rounded-md dark:border-gray-300 dark:bg-gray-50 dark:text-gray-800 focus:dark:border-violet-600"
                        />
                    </div>
                    <button
                        id="sign-button"
                        class="w-full p-3 text-center rounded-sm dark:text-gray-50 dark:bg-violet-600"
                    >
                        Sign in
                    </button>
                </form>
                <div class="flex items-center pt-4 space-x-1">
                    <div class="flex-1 h-px sm:w-16 dark:bg-gray-300"></div>
                    <p class="px-3 text-sm dark:text-gray-600">or</p>
                    <div class="flex-1 h-px sm:w-16 dark:bg-gray-300"></div>
                </div>

                <p class="text-xs text-center sm:px-6 dark:text-gray-600">
                    Demo Credentials:
                </p>
                <div class="bg-gray-200 p-10 rounded-lg text-center">
                    <p class="font-bold">
                        Username: <span class="font-normal">admin</span>
                    </p>
                    <p class="font-bold">
                        Password: <span class="font-normal">admin123</span>
                    </p>
                </div>
            </div>
        </section>

        <script type="module" src="./scripts/signin.js"></script>
    </body>
</html>
